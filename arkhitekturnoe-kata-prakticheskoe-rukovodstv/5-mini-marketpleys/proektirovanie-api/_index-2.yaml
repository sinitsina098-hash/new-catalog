openapi: 3.0.3
info:
  title: Marketplace Ads API
  version: 1.0.0
  description: API для публикации, обновления и модерации объявлений
servers:
  - url: https://api.marketplace.local/v1
tags:
  - name: Sellers
    description: Методы для продавцов
  - name: Moderators
    description: Методы для модераторов

paths:
  /ads/publish:
    post:
      tags: [Sellers]
      summary: Публикация объявления
      description: Автоматический скоринг, приостановка или блокировка объявления при публикации
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Успешная публикация / блокировка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Неверные данные
        '401':
          description: Неавторизован
        '403':
          description: Доступ запрещен
        '404':
          description: Объявление не найдено

  /ads/update:
    post:
      tags: [Sellers]
      summary: Обновление объявления
      description: Автоматический скоринг, приостановка или блокировка объявления при обновлении
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequest'
      responses:
        '200':
          description: Успешное обновление / блокировка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { description: Неверные данные }
        '401': { description: Неавторизован }
        '403': { description: Доступ запрещен }
        '404': { description: Объявление не найдено }

  /ads/moderation-data:
    post:
      tags: [Moderators]
      summary: Получение материалов по объявлению
      description: Возвращает материалы по объявлению для модерации
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationDataRequest'
      responses:
        '200':
          description: Материалы объявления
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemResponse'
        '400': { description: Неверные данные }
        '401': { description: Неавторизован }
        '403': { description: Доступ запрещен }
        '404': { description: Объявление не найдено }

  /ads/moderate:
    post:
      tags: [Moderators]
      summary: Модерация объявления
      description: Отправка решения модератора в сервис и БД
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationRequest'
      responses:
        '200':
          description: Решение модерации сохранено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { description: Неверные данные }
        '401': { description: Неавторизован }
        '403': { description: Доступ запрещен }
        '404': { description: Объявление не найдено }

components:
  schemas:
    PublishRequest:
      type: object
      required: [user_id, product_id, text, photos, created_at, modified_at, place]
      properties:
        user_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        text: { type: string }
        photos:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        modified_at: { type: string, format: date-time }
        place: { type: string }

    UpdateRequest:
      type: object
      required: [user_id, product_id, old_product_id, text, photos, created_at, modified_at, place]
      properties:
        user_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        old_product_id: { type: string, format: uuid }
        text: { type: string }
        photos:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        modified_at: { type: string, format: date-time }
        place: { type: string }

    ModerationDataRequest:
      type: object
      required: [user_id, product_id]
      properties:
        user_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }

    ModerationRequest:
      type: object
      required: [user_id, product_id, status, solution_dt]
      properties:
        user_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        status: { type: string, enum: [blocked, approved, stopped] }
        solution_dt: { type: string, format: date-time }

    UserResponse:
      type: object
      properties:
        status_code: { type: integer, example: 200 }
        message: { type: string }

    SystemResponse:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        old_product_id: { type: string, format: uuid }
        status: { type: string }
        created_at: { type: string, format: date-time }
        modified_at: { type: string, format: date-time }
        text: { type: string }
        photos:
          type: array
          items: { type: string }
        place: { type: string }
        score: { type: number, format: float }
        block: { type: boolean }
        stop_for_manual: { type: boolean }
